<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-разминка: Проверь свой аим и инпут лаг | Input Lag Lab</title>
    
    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a; color: #ffffff;
            display: flex; flex-direction: column; align-items: center;
        }

        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('i1583076866325242.jpeg') no-repeat center center; 
            background-size: cover; z-index: -1;
        }

        .content-box {
            margin: 60px 20px; background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px); padding: 40px; border-radius: 24px;
            max-width: 850px; width: 90%; border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1 { color: #ff4655; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; font-style: italic; }

        /* Стили тренажера */
        #game-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        #stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px 12px 0 0;
            border: 1px solid rgba(0, 255, 204, 0.1);
            font-weight: bold;
            color: #00ffcc;
        }

        #game-field {
            width: 100%;
            height: 450px;
            background: #050505;
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-top: none;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            border-radius: 0 0 12px 12px;
        }

        .target {
            width: 25px;
            height: 25px;
            background: #ff4655;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 15px #ff4655;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .target:active { transform: scale(0.8); }

        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .btn {
            padding: 15px 40px;
            background: #ff4655;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn:hover { background: #ff5f6d; box-shadow: 0 0 20px rgba(255, 70, 85, 0.4); }

        nav { margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px; text-align: left; width: 100%; }
        nav a { color: #00ffcc; text-decoration: none; margin-right: 25px; font-weight: bold; transition: 0.3s; }
        nav a:hover { color: #ff4655; }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <main class="content-box">
        <div style="text-align: right; margin-bottom: 10px;">
            <span style="color: #fff; font-weight: bold;">RU</span> | 
            <a href="en/trainer.html" style="color: #00ffcc; text-decoration: none;">EN</a>
        </div>

        <h1>Мини Разминка</h1>
        <p class="subtitle">Проверь регистрацию выстрелов и отзывчивость сенсора</p>

        <div id="game-container">
            <div id="stats-bar">
                <span>Счет: <span id="score">0</span></span>
                <span>Время: <span id="timer">30</span>с</span>
                <span>Точность: <span id="accuracy">100</span>%</span>
            </div>
            <div id="game-field">
                <div id="start-screen">
                    <p style="margin-bottom: 20px; color: #e0e0e0;">У тебя есть 30 секунд.<br>Кликай по красным мишеням как можно быстрее.</p>
                    <button class="btn" onclick="startGame()">Начать тест</button>
                </div>
            </div>
        </div>

        <nav>
            <a href="index.html">Главная</a>
            <a href="electricity.html">Электросеть</a>
            <a href="mystory.html">Моя история</a>
        </nav>
    </main>

    <script>
        let score = 0;
        let totalClicks = 0;
        let timeLeft = 30;
        let gameActive = false;
        let timerId;

        const field = document.getElementById('game-field');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const accDisplay = document.getElementById('accuracy');

        function startGame() {
            score = 0;
            totalClicks = 0;
            timeLeft = 30;
            gameActive = true;
            
            scoreDisplay.textContent = '0';
            timerDisplay.textContent = '30';
            accDisplay.textContent = '100';
            
            document.getElementById('start-screen').style.display = 'none';
            
            field.addEventListener('mousedown', countMiss);
            
            spawnTarget();
            
            timerId = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function spawnTarget() {
            if (!gameActive) return;
            
            const target = document.createElement('div');
            target.className = 'target';
            
            const x = Math.random() * (field.clientWidth - 40) + 5;
            const y = Math.random() * (field.clientHeight - 40) + 5;
            
            target.style.left = x + 'px';
            target.style.top = y + 'px';
            
            target.addEventListener('mousedown', (e) => {
                e.stopPropagation(); // Чтобы не считался промах по полю
                score++;
                totalClicks++;
                scoreDisplay.textContent = score;
                updateAccuracy();
                target.remove();
                spawnTarget();
            });
            
            field.appendChild(target);
        }

        function countMiss() {
            if (!gameActive) return;
            totalClicks++;
            updateAccuracy();
        }

        function updateAccuracy() {
            const acc = totalClicks === 0 ? 100 : Math.round((score / totalClicks) * 100);
            accDisplay.textContent = acc;
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerId);
            field.removeEventListener('mousedown', countMiss);
            
            field.innerHTML = `
                <div id="start-screen">
                    <h2 style="color: #ff4655;">Время вышло!</h2>
                    <p style="font-size: 1.5em; margin: 10px 0;">Твой счет: ${score}</p>
                    <p style="margin-bottom: 20px;">Точность: ${accDisplay.textContent}%</p>
                    <button class="btn" onclick="location.reload()">Попробовать снова</button>
                </div>
            `;
        }
    </script>
</body>
</html>
