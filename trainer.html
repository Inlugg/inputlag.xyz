<!DOCTYPE html>
<html>
<head>
    <title>8K Hz Unlocked Aim Trainer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; color: #00ff00; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; cursor: none; }
        .ui { 
            position: absolute; top: 20px; left: 20px; 
            background: rgba(0,0,0,0.95); padding: 20px; 
            border: 1px solid #ff4655; width: 220px; z-index: 10;
        }
        .btn-reset {
            background: #ff4655; color: white; border: none;
            padding: 10px; width: 100%; cursor: pointer;
            font-weight: bold; text-transform: uppercase; margin-bottom: 15px;
        }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px solid #222; }
        .val { color: #fff; font-size: 20px; font-weight: bold; font-family: monospace; }
        .stat-label { color: #888; font-size: 11px; text-transform: uppercase; align-self: center; }
        .timer { color: #ff4655; font-size: 36px; font-weight: bold; text-align: center; display: block; }
        #results-screen {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 10, 10, 0.98); padding: 40px; border: 2px solid #ff4655;
            text-align: center; z-index: 100; min-width: 320px;
        }
    </style>
</head>
<body>
    <div id="results-screen">
        <h2 style="color: #fff; text-transform: uppercase;">Результат</h2>
        <div class="stat-row"><span class="stat-label">AVG Polling Rate:</span> <span id="res-hz" class="val" style="color: #00ff00;">0 Hz</span></div>
        <div class="stat-row"><span class="stat-label">Стабильность:</span> <span id="res-hz-status" class="val">--</span></div>
        <br>
        <button class="btn-reset" onclick="resetGame()">В бой</button>
    </div>

    <div class="ui">
        <button class="btn-reset" onclick="resetGame()">Reset</button>
        <div class="stat-row"><span class="stat-label">Mouse Hz:</span> <span id="mhz" class="val" style="color: #00ff00;">0</span></div>
        <div class="stat-row"><span class="stat-label">Heads:</span> <span id="heads" class="val">0</span></div>
        <div id="hit-type" style="text-align:center; height:20px; margin: 10px 0;"></div>
        <span id="timer" class="timer">60</span>
    </div>
    <canvas id="game"></canvas>

<script>
    const canvas = document.getElementById('game');
    // desynchronized: true — отключает VSync для канваса, минимизирует задержку
    const ctx = canvas.getContext('2d', { desynchronized: true });
    
    let mouseX = 0, mouseY = 0;
    let stats = { head: 0, body: 0, miss: 0 };
    let timeLeft = 60, isPaused = false, countdownInterval;
    let target = { x: 0, y: 0, hp: 100 };

    // High-Res Polling Data
    let lastEventTime = performance.now();
    let sumHz = 0, totalHzSamples = 0, hzDrops = 0;

    function respawn() {
        target.x = Math.random() * (window.innerWidth - 400) + 350;
        target.y = Math.random() * (window.innerHeight - 300) + 150;
        target.hp = 100;
    }

    function resetGame() {
        clearInterval(countdownInterval);
        isPaused = false;
        document.getElementById('results-screen').style.display = "none";
        stats = { head: 0, body: 0, miss: 0 };
        sumHz = 0; totalHzSamples = 0; hzDrops = 0;
        timeLeft = 60;
        updateUI();
        respawn();
        countdownInterval = setInterval(() => {
            if (isPaused) return;
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) showFinalResults();
        }, 1000);
    }

    function showFinalResults() {
        isPaused = true;
        const avgHz = totalHzSamples > 0 ? Math.round(sumHz / totalHzSamples) : 0;
        document.getElementById('res-hz').innerText = avgHz + " Hz";
        const statusEl = document.getElementById('res-hz-status');
        if (hzDrops > 20) {
            statusEl.innerText = "ПРОСАДКИ"; statusEl.style.color = "#ff4655";
        } else {
            statusEl.innerText = "СТАБИЛЬНО"; statusEl.style.color = "#00ff00";
        }
        document.getElementById('results-screen').style.display = "block";
    }

    function updateUI() {
        document.getElementById('heads').innerText = stats.head;
    }

    // КЛЮЧЕВОЙ БЛОК: Обработка ввода вне цикла отрисовки
    window.addEventListener('pointermove', e => { 
        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        
        for (let i = 0; i < events.length; i++) {
            const now = performance.now();
            const delta = now - lastEventTime;
            
            if (delta > 0 && delta < 100) {
                const currentHz = 1000 / delta;
                sumHz += currentHz;
                totalHzSamples++;
                if (delta > 2) hzDrops++; // Порог статтера для 1k+ Hz
                
                // Обновляем счетчик на UI не слишком часто, чтобы не жрать ресурсы
                if (totalHzSamples % 100 === 0) {
                    document.getElementById('mhz').innerText = Math.round(currentHz);
                }
            }
            lastEventTime = now;
        }
        mouseX = e.clientX; 
        mouseY = e.clientY; 
    }, { passive: true });

    window.addEventListener('mousedown', () => {
        if (isPaused) return;
        let distHead = Math.hypot(mouseX - target.x, mouseY - (target.y - 80));
        if (distHead < 20) {
            stats.head++;
            respawn();
            updateUI();
        }
    });

    function loop() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        if (!isPaused) {
            // Отрисовка цели
            ctx.fillStyle = "#ececec";
            ctx.beginPath(); ctx.arc(target.x, target.y - 80, 20, 0, Math.PI * 2); ctx.fill();
            ctx.fillRect(target.x - 25, target.y - 55, 50, 70);
            
            // Прицел
            ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(mouseX - 10, mouseY); ctx.lineTo(mouseX + 10, mouseY);
            ctx.moveTo(mouseX, mouseY - 10); ctx.lineTo(mouseX, mouseY + 10); ctx.stroke();
        }
        requestAnimationFrame(loop);
    }

    resetGame();
    loop();
</script>
</body>
</html>
