<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Aim Test</title>
    <style>
        body { background: #111; color: #fff; font-family: Arial, sans-serif; text-align: center; }
        
        #status-panel {
            background: #222 !important;
            border: 2px solid #ff4655 !important;
            display: inline-block !important;
            padding: 15px 30px !important;
            margin: 20px auto !important;
            border-radius: 10px !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative !important;
        }

        .stat-text {
            display: inline-block !important;
            font-size: 36px !important;
            font-weight: bold !important;
            margin: 0 20px !important;
            color: #fff !important;
        }

        #timer-val { color: #ff4655 !important; }
        #score-val { color: #00ffcc !important; }

        #game-area {
            width: 90vw; height: 500px; max-width: 1000px;
            background: #000; margin: 0 auto; position: relative;
            border: 3px solid #333; overflow: hidden; cursor: none; /* Скрыли обычный курсор */
        }

        /* ИСПРАВЛЕННЫЙ ПРИЦЕЛ */
        #aim-cursor {
            width: 10px; height: 10px; 
            background: #ffffff !important; /* Всегда белый */
            border-radius: 50%; position: absolute;
            pointer-events: none; display: none; z-index: 999;
            box-shadow: 0 0 8px #ffffff;
            /* Защита от инверсии цветов расширениями */
            filter: none !important; 
            mix-blend-mode: normal !important;
        }

        #target-dot {
            width: 50px; height: 50px; background: #33ff00;
            border-radius: 50%; position: absolute; display: none;
            box-shadow: 0 0 20px #33ff00;
        }

        .main-btn {
            padding: 20px 40px; background: #ff4655; color: #fff;
            border: none; font-size: 20px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>РАЗМИНКА ПЕРЕД ИГРОЙ</h1>

    <div id="status-panel">
        <div class="stat-text">ВРЕМЯ: <span id="timer-val">60</span></div>
        <div class="stat-text">СЧЕТ: <span id="score-val">0</span></div>
    </div>

    <div id="game-area">
        <div id="aim-cursor"></div> <div id="target-dot"></div>
        <div id="menu" style="margin-top: 180px;">
            <button class="main-btn" onclick="startTest()">НАЧАТЬ ТЕСТ (60 СЕК)</button>
        </div>
    </div>

    <script>
        let seconds = 60;
        let points = 0;
        let isPlaying = false;
        let timerTick;

        const timerDisplay = document.getElementById('timer-val');
        const scoreDisplay = document.getElementById('score-val');
        const dot = document.getElementById('target-dot');
        const cursor = document.getElementById('aim-cursor');
        const area = document.getElementById('game-area');

        function startTest() {
            if(isPlaying) return;
            
            seconds = 60;
            points = 0;
            isPlaying = true;

            timerDisplay.innerHTML = seconds;
            scoreDisplay.innerHTML = points;
            
            document.getElementById('menu').style.display = 'none';
            dot.style.display = 'block';
            cursor.style.display = 'block';
            
            reposition();

            clearInterval(timerTick);
            timerTick = setInterval(() => {
                seconds--;
                timerDisplay.innerHTML = seconds;
                if (seconds <= 0) stopTest();
            }, 1000);

            area.onmousemove = (e) => {
                const r = area.getBoundingClientRect();
                const mx = e.clientX - r.left;
                const my = e.clientY - r.top;
                
                // Двигаем прицел за мышкой
                cursor.style.left = (mx - 5) + 'px';
                cursor.style.top = (my - 5) + 'px';

                if (!isPlaying) return;
                
                const tx = parseInt(dot.style.left);
                const ty = parseInt(dot.style.top);
                
                if (mx > tx && mx < tx + 50 && my > ty && my < ty + 50) {
                    points++;
                    scoreDisplay.innerHTML = points;
                    reposition();
                }
            };
        }

        function reposition() {
            dot.style.left = Math.random() * (area.clientWidth - 60) + "px";
            dot.style.top = Math.random() * (area.clientHeight - 60) + "px";
        }

        function stopTest() {
            isPlaying = false;
            clearInterval(timerTick);
            dot.style.display = 'none';
            cursor.style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            alert("Конец! Твой счет: " + points);
        }
    </script>
</body>
</html>
