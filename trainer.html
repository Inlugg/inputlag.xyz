<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Tracking Test | Input Lag Lab</title>
    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a; color: #ffffff;
            display: flex; flex-direction: column; align-items: center;
        }

        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('i1583076866325242.jpeg') no-repeat center center; 
            background-size: cover; z-index: -1;
        }

        .content-box {
            margin: 60px 20px; background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px); padding: 40px; border-radius: 24px;
            max-width: 850px; width: 90%; border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1 { color: #ff4655; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }

        #game-field {
            width: 100%; height: 450px; background: #050505;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative; overflow: hidden; cursor: none;
            border-radius: 12px;
        }

        /* Прицел (маленький шарик) */
        #aim-dot {
            width: 10px; height: 10px; background: #00ffcc;
            border-radius: 50%; position: absolute;
            pointer-events: none; display: none; z-index: 10;
        }

        /* Цель (большой шарик) */
        #target-ball {
            width: 50px; height: 50px; background: #ff4655;
            border-radius: 50%; position: absolute; display: none;
            box-shadow: 0 0 20px rgba(255, 70, 85, 0.4);
        }

        #stats { margin-bottom: 15px; font-size: 1.2em; color: #00ffcc; font-weight: bold; }

        .btn {
            padding: 15px 40px; background: #ff4655; color: white;
            border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
        }

        nav { margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px; text-align: left; }
        nav a { color: #00ffcc; text-decoration: none; margin-right: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <main class="content-box">
        <h1>Разминка Трекинга</h1>
        <div id="stats">Собрано целей: <span id="score">0</span></div>

        <div id="game-field">
            <div id="aim-dot"></div>
            <div id="target-ball"></div>
            
            <div id="start-screen" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                <button class="btn" onclick="startGame()">Начать тест</button>
            </div>
        </div>

        <nav>
            <a href="index.html">Главная</a>
            <a href="electricity.html">Электросеть</a>
            <a href="mystory.html">Моя история</a>
        </nav>
    </main>

    <script>
        const dot = document.getElementById('aim-dot');
        const ball = document.getElementById('target-ball');
        const field = document.getElementById('game-field');
        const scoreEl = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        
        let score = 0;

        function startGame() {
            score = 0;
            scoreEl.textContent = score;
            startScreen.style.display = 'none';
            dot.style.display = 'block';
            ball.style.display = 'block';
            moveBall();

            field.onmousemove = (e) => {
                const rect = field.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                dot.style.left = (x - 5) + 'px';
                dot.style.top = (y - 5) + 'px';

                checkCollision(x, y);
            };
        }

        function moveBall() {
            const maxX = field.clientWidth - 55;
            const maxY = field.clientHeight - 55;
            ball.style.left = (Math.random() * maxX + 5) + 'px';
            ball.style.top = (Math.random() * maxY + 5) + 'px';
        }

        function checkCollision(x, y) {
            const bX = parseInt(ball.style.left);
            const bY = parseInt(ball.style.top);

            // Если маленький шарик коснулся большого (50x50)
            if (x > bX && x < bX + 50 && y > bY && y < bY + 50) {
                score++;
                scoreEl.textContent = score;
                moveBall();
            }
        }
    </script>
</body>
</html>
