<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини Разминка: Трекинг и Инпут Лаг | Input Lag Lab</title>
    
    <style>
        body, html {
            margin: 0; padding: 0; min-height: 100%;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a; color: #ffffff;
            display: flex; flex-direction: column; align-items: center;
        }

        .background-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), 
                        url('i1583076866325242.jpeg') no-repeat center center; 
            background-size: cover; z-index: -1;
        }

        .content-box {
            margin: 60px 20px; background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px); padding: 40px; border-radius: 24px;
            max-width: 850px; width: 90%; border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1 { color: #ff4655; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; font-style: italic; }

        #game-container { width: 100%; max-width: 700px; margin: 0 auto; }

        #stats-bar {
            display: flex; justify-content: space-between; padding: 15px;
            background: rgba(255, 255, 255, 0.05); border-radius: 12px 12px 0 0;
            border: 1px solid rgba(0, 255, 204, 0.1); font-weight: bold; color: #00ffcc;
        }

        #game-field {
            width: 100%; height: 450px; background: #050505;
            border: 1px solid rgba(0, 255, 204, 0.2); border-top: none;
            position: relative; overflow: hidden; cursor: none; /* Скрываем курсор в игре */
            border-radius: 0 0 12px 12px;
        }

        /* Змейка/Курсор */
        #snake-head {
            width: 18px; height: 18px; background: #00ffcc;
            border-radius: 50%; position: absolute;
            box-shadow: 0 0 15px #00ffcc; pointer-events: none;
            display: none; z-index: 10;
        }

        /* Корзина/Цель */
        #basket {
            width: 60px; height: 60px; font-size: 35px;
            display: none; align-items: center; justify-content: center;
            position: absolute; background: rgba(0, 255, 204, 0.05);
            border: 2px dashed #ff4655; border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(255, 70, 85, 0.2);
        }

        #start-screen {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); text-align: center; width: 80%;
        }

        .btn {
            padding: 15px 40px; background: #ff4655; color: white;
            border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }

        .btn:hover { background: #ff5f6d; box-shadow: 0 0 20px rgba(255, 70, 85, 0.4); }

        nav { margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 30px; text-align: left; }
        nav a { color: #00ffcc; text-decoration: none; margin-right: 25px; font-weight: bold; transition: 0.3s; }
        nav a:hover { color: #ff4655; }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <main class="content-box">
        <div style="text-align: right; margin-bottom: 10px;">
            <span style="color: #fff; font-weight: bold;">RU</span> | 
            <a href="en/trainer.html" style="color: #00ffcc; text-decoration: none;">EN</a>
        </div>

        <h1>Мини Разминка</h1>
        <p class="subtitle">Тренировка трекинга: веди змейку в корзину</p>

        <div id="game-container">
            <div id="stats-bar">
                <span>Целей: <span id="score">0</span></span>
                <span>Твой пинг системы: <span id="status">Тест связи</span></span>
            </div>
            <div id="game-field">
                <div id="snake-head"></div>
                <div id="basket">🗑️</div>
                
                <div id="start-screen">
                    <p style="color: #e0e0e0; margin-bottom: 20px;">
                        В этой версии мы тестируем <b>плавность (smoothness)</b>.<br>
                        Удерживай светящуюся точку и веди её в корзину.
                    </p>
                    <button class="btn" onclick="startGame()">Начать трекинг</button>
                </div>
            </div>
        </div>

        <nav>
            <a href="index.html">Главная</a>
            <a href="electricity.html">Электросеть</a>
            <a href="mystory.html">Моя история</a>
        </nav>
    </main>

    <script>
        const head = document.getElementById('snake-head');
        const basket = document.getElementById('basket');
        const field = document.getElementById('game-field');
        const scoreEl = document.getElementById('score');
        const statusEl = document.getElementById('status');
        const startScreen = document.getElementById('start-screen');
        
        let score = 0;
        let gameActive = false;

        function startGame() {
            score = 0;
            scoreEl.textContent = score;
            statusEl.textContent = "ВЕДИ!";
            startScreen.style.display = 'none';
            head.style.display = 'block';
            basket.style.display = 'flex';
            
            moveBasket();

            field.onmousemove = (e) => {
                if (!gameActive && startScreen.style.display === 'none') gameActive = true;
                
                const rect = field.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Точка следует за курсором
                head.style.left = (x - 9) + 'px';
                head.style.top = (y - 9) + 'px';

                checkCollision(x, y);
            };
        }

        function moveBasket() {
            const maxX = field.clientWidth - 70;
            const maxY = field.clientHeight - 70;
            const x = Math.random() * maxX + 5;
            const y = Math.random() * maxY + 5;
            
            basket.style.left = x + 'px';
            basket.style.top = y + 'px';
        }

        function checkCollision(x, y) {
            const bX = parseInt(basket.style.left);
            const bY = parseInt(basket.style.top);

            // Если центр точки попал в область корзины (60x60)
            if (x > bX && x < bX + 60 && y > bY && y < bY + 60) {
                score++;
                scoreEl.textContent = score;
                moveBasket();
                
                // Легкая вспышка рамки при попадании
                field.style.borderColor = '#00ffcc';
                setTimeout(() => { field.style.borderColor = 'rgba(0, 255, 204, 0.2)'; }, 100);
            }
        }
    </script>
</body>
</html>
