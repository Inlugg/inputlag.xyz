<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Test | Input Lag Lab</title>
    <style>
        body {
            background: #111; color: #fff;
            font-family: sans-serif; text-align: center;
            margin: 0; padding: 20px;
        }

        /* ПАНЕЛЬ С ТАЙМЕРОМ - ТЕПЕРЬ ОНА ОТДЕЛЬНО */
        .dashboard {
            background: #222;
            padding: 20px;
            border: 2px solid #ff4655;
            display: inline-block;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .stat-box {
            display: inline-block;
            margin: 0 30px;
            font-size: 32px;
            font-weight: bold;
        }

        #timer { color: #ff4655; } /* Таймер будет красным всегда */
        #score { color: #00ffcc; }

        #game-field {
            width: 90vw; height: 500px;
            max-width: 1200px;
            background: #000;
            margin: 0 auto;
            position: relative;
            border: 2px solid #333;
            overflow: hidden;
            cursor: crosshair;
        }

        #target {
            width: 50px; height: 50px;
            background: #33ff00;
            border-radius: 50%;
            position: absolute;
            display: none;
            box-shadow: 0 0 15px #33ff00;
        }

        .btn {
            padding: 15px 40px; background: #ff4655;
            color: #fff; border: none; font-size: 20px;
            cursor: pointer; font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>AIM TRACKING TEST</h1>

    <div class="dashboard">
        <div class="stat-box">ВРЕМЯ: <span id="timer">60</span>с</div>
        <div class="stat-box">СЧЕТ: <span id="score">0</span></div>
    </div>

    <div id="game-field">
        <div id="target"></div>
        
        <div id="overlay" style="padding-top: 200px;">
            <h2 id="msg"></h2>
            <button class="btn" onclick="startGame()">ИГРАТЬ (60 СЕК)</button>
        </div>
    </div>

    <script>
        let timeLeft = 60;
        let points = 0;
        let timerId;
        let isRunning = false;

        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const target = document.getElementById('target');
        const field = document.getElementById('game-field');
        const overlay = document.getElementById('overlay');
        const msg = document.getElementById('msg');

        function startGame() {
            timeLeft = 60;
            points = 0;
            isRunning = true;

            timerEl.innerText = timeLeft;
            scoreEl.innerText = points;
            
            overlay.style.display = 'none';
            target.style.display = 'block';
            
            move();

            clearInterval(timerId);
            timerId = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    stopGame();
                }
            }, 1000);

            field.onmousemove = (e) => {
                if (!isRunning) return;
                const rect = field.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const tx = parseInt(target.style.left);
                const ty = parseInt(target.style.top);
                
                if (x > tx && x < tx + 50 && y > ty && y < ty + 50) {
                    points++;
                    scoreEl.innerText = points;
                    move();
                }
            };
        }

        function move() {
            const maxX = field.clientWidth - 60;
            const maxY = field.clientHeight - 60;
            target.style.left = Math.random() * maxX + "px";
            target.style.top = Math.random() * maxY + "px";
        }

        function stopGame() {
            isRunning = false;
            clearInterval(timerId);
            target.style.display = 'none';
            overlay.style.display = 'block';
            msg.innerHTML = "КОНЕЦ!<br>ТВОЙ РЕЗУЛЬТАТ: " + points;
        }
    </script>

</body>
</html>
